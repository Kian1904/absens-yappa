<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Absensi SMK Yappa Depok</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div class="container">
    <div class="card header-card">
      <div class="brand">
        <span class="logo">📍</span>
        <div>
          <h1>Absensi SMK Yappa Depok</h1>
          <p class="subtitle">Sistem Presensi GPS & Validasi Selfie</p>
        </div>
      </div>
      
      <div class="gps-box">
        <div class="gps-header">
          <span class="label-title">Status GPS</span>
          <span id="gps-badge" class="badge idle">Belum Diambil</span>
        </div>
        <div class="gps-info">
          <div class="coord-item"><span>Latitude:</span> <b id="val-lat">-</b></div>
          <div class="coord-item"><span>Longitude:</span> <b id="val-lng">-</b></div>
          <div class="coord-item"><span>Akurasi:</span> <b id="val-acc">-</b></div>
        </div>
        <button type="button" class="btn btn-secondary" id="btn-gps">📍 Ambil Lokasi Presisi</button>
      </div>
    </div>

    <div class="card form-card">
      <form id="form-absen">
        <div class="form-group">
          <label for="nama">Nama Lengkap / NIS</label>
          <input type="text" id="nama" class="form-control" placeholder="Contoh: Kiann / 12345" required autocomplete="off">
        </div>

        <div class="form-row">
          <div class="form-group col">
            <label for="role">Role</label>
            <select id="role" class="form-control">
              <option value="siswa">Siswa</option>
              <option value="guru">Guru</option>
              <option value="staff">Staff</option>
            </select>
          </div>
          <div class="form-group col">
            <label for="tipe">Metode Absen</label>
            <select id="tipe" class="form-control">
              <option value="gps">GPS Saja</option>
              <option value="foto">GPS + Selfie</option>
            </select>
          </div>
        </div>

        <!-- Section Selfie -->
        <div id="section-selfie" class="form-group selfie-box" style="display: none;">
          <label>Foto Selfie (Wajib Kamera Langsung)</label>
          <input type="file" id="camera-input" accept="image/*" capture="user" style="display: none;">
          <button type="button" class="btn btn-outline" id="btn-camera">📸 Buka Kamera Selfie</button>
          <div class="preview-wrapper" id="preview-wrapper" style="display: none;">
            <img id="photo-preview" alt="Preview Foto">
            <span class="preview-badge">Terkonversi 600px WebP/JPEG</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-submit">
          <span class="btn-text">✅ Kirim Absensi</span>
        </button>
      </form>

      <div id="alert-box" class="alert" style="display: none;"></div>
    </div>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
